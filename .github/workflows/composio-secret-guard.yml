name: Composio secret guard

# COMPOSIO_API_KEY grants access to EVERY connected account of EVERY tenant.
# It is allowed to appear in exactly four files:
#   digicrm/settings.py                       - the single config read
#   integrations/services/composio_client.py  - the single consumer
#   .env.example                              - documentation, always blank
#   integrations/tests.py                     - override_settings with fakes,
#                                               including the leakage tests
# Anywhere else - a view, a serializer, a task, a management command, a
# frontend env file, a committed .env - is a leak. This job fails the build.

on:
  push:
  pull_request:

jobs:
  composio-secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: COMPOSIO_API_KEY must stay inside its allowlist
        run: |
          set -euo pipefail
          hits=$(grep -rn --binary-files=without-match 'COMPOSIO_API_KEY' . \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=node_modules \
            --exclude-dir=.github \
            --exclude='settings.py' \
            --exclude='composio_client.py' \
            --exclude='tests.py' \
            --exclude='.env.example' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::COMPOSIO_API_KEY referenced outside its allowlist"
            echo "$hits"
            exit 1
          fi
          echo "OK: COMPOSIO_API_KEY confined to settings.py, composio_client.py, tests.py, .env.example"

      - name: No real Composio key value may be committed
        run: |
          set -euo pipefail
          # A literal key next to the variable name in a non-test, non-example
          # file is always a mistake.
          hits=$(grep -rnE "COMPOSIO_API_KEY[[:space:]]*[=:][[:space:]]*[\"'][A-Za-z0-9_-]{16,}" . \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude-dir=node_modules \
            --exclude-dir=.github \
            --exclude='tests.py' \
            --exclude='.env.example' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::A literal COMPOSIO_API_KEY value appears to be committed"
            echo "$hits"
            exit 1
          fi
          echo "OK: no committed COMPOSIO_API_KEY value"

      - name: The Composio key must never reach the browser
        run: |
          set -euo pipefail
          # Vite only exposes VITE_*-prefixed variables to the bundle, so a
          # VITE_COMPOSIO_* variable anywhere means the key is shipping to
          # end users. The frontend only ever handles the opaque redirect_url.
          hits=$(grep -rn --binary-files=without-match 'VITE_COMPOSIO' . \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules \
            --exclude-dir=.github || true)
          if [ -n "$hits" ]; then
            echo "::error::VITE_COMPOSIO_* found - the Composio key must never be exposed to the browser"
            echo "$hits"
            exit 1
          fi
          echo "OK: no VITE_COMPOSIO_* variables"
